<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReStyle</title>
    <link rel="stylesheet" href="det.css">
</head>
<body>
   <header>
    <h1><b><i><a href="#" class="clean-link">ReStyle</a></i></b></h1>
    <nav>
        <ul>
    
        <li><a href="#">Login/Sign Up</a></li>
        
        </ul>

           

    </nav>
    </header>


    <div class="search-bar">
        <input type="text"  placeholder="Search For Clothes...">
        <button>search</button>     
    </div>






    <br>

    <section class="hero" id="hero">
        <h2> Good clothes, second chances. </h2>
        <p>A marketplace for quality second-hand clothes at fair prices.</p>
        <button onclick="showAlert()">Learn More</button>
        <h3>Log In</h3>
    </section>


       <section class="LoginForm" id="LoginForm">
        <form>
        <input type="text" id="email"   placeholder="Email" required/>
        <input type="text" id="password" placeholder="Password" required/>
        <button type="submit">Log in</button>

        </form>
        <p id="formStatus"></p>
       </section>



    <section class="featured">
        <h2>Featured Items</h2>
        <div class="items">
            <div class="item">
                <img src="vintage t shirt.jpg" alt="T-shirt">
                <p>Vintage T-shirt - $12</p>
            </div>
            <div class="item">
                <img src="jacket.jpg" alt="Jacket">
                <p>Denim Jacket - $25</p>
            </div>
            <div class="item">
                <img src="tmira.jpg" alt="Shoes">
                <p>Retro Sneakers - $30</p>
            </div>
        </div>
    </section>
    




    <footer>
  <ul class="footer-links">
    <li><a href="register.html">Register</a></li>
    <li><a href="#">Contact</a></li>
    <li><a href="#">About</a></li>
  </ul>
</footer>



</body>
</html>
